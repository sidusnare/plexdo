# yamllint configuration: the default rules, at Google's 80 columns.
---
extends: default

ignore: |
  node_modules/
  build/
  dist/

rules:
  line-length:
    max: 80
  # GitHub Actions requires the key "on", which YAML 1.1 reads as a
  # boolean; keys are exempt, values are still checked.
  truthy:
    check-keys: false
