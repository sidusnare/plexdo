[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plexdo"
version = "1.1.16"
description = "A command-line interface for Plex Media Server: playlists, exports, watched-state sync, and library management."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "SidusNare" }]
keywords = ["plex", "plexapi", "cli", "playlist", "m3u", "media-server"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

dependencies = [
    "PlexAPI>=4.15.10",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pylint>=3.0", "build>=1.0", "twine>=5.0", "pytest>=8.0", "PyYAML>=6.0", "vulture>=2.11"]

[project.urls]
Homepage = "https://github.com/sidusnare/plexdo"
Source = "https://github.com/sidusnare/plexdo"
Issues = "https://github.com/sidusnare/plexdo/issues"

[project.scripts]
plexdo = "plexdo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plexdo = ["py.typed", "data/plexdo.bash", "data/_plexdo", "data/plexdo.fish",
          "data/plexdo.ps1", "data/plexdo.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.pylint.main]
py-version = "3.11"

[tool.pylint."messages control"]
disable = ["line-too-long", "too-few-public-methods"]

[tool.pylint.design]
max-args = 8
